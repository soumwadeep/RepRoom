[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reproom-rep-engine"
version = "0.1.0"
description = "Count reps and grade exercise form from pose landmarks. Deterministic, dependency-free core, single-camera honest."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Soumwadeep Guha" }]
keywords = [
    "pose-estimation",
    "rep-counting",
    "fitness",
    "computer-vision",
    "mediapipe",
    "form-checking",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Health",
]
# The engine is deliberately dependency-free: geometry, exercises and the
# state machine use only the standard library.
dependencies = []

[project.optional-dependencies]
detect = ["mediapipe>=0.10.14"]
dev = ["pytest>=8", "numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/soumwadeep/RepRoom"
Repository = "https://github.com/soumwadeep/RepRoom"
Issues = "https://github.com/soumwadeep/RepRoom/issues"

[tool.setuptools]
package-dir = { "" = "." }
packages = ["reproom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
